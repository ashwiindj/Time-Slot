
<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: black;
        }

        table {
            width: 85%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
        </tr>

        {% for slot in timetable %}
        <tr>
            <td>{{ slot.day }}</td>

            <td>
                {{ slot.start_time }} -
                {{ slot.end_time }}
            </td>

            <td>{{ slot.subject_name }}</td>

            <td>{{ slot.faculty_name }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="4">No timetable records available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
